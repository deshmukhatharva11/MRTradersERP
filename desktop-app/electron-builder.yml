# =============================================================
# MR Traders ERP — Electron Builder Configuration
# =============================================================
# Security notes:
#   - ASAR packaging is ON (requirement 10)
#   - Code signing requires CSC_LINK and CSC_KEY_PASSWORD env vars
#   - electron-updater uses the publish config for auto-updates
#   - Unnecessary files are excluded from the ASAR
# =============================================================

appId: com.mrtraders.erp
productName: MR Traders ERP
copyright: Copyright © 2026 MR Traders

# ── Directories ──────────────────────────────────────────────
directories:
  buildResources: assets
  output: dist

# ── ASAR Packaging [REQ 10] ──────────────────────────────────
asar: true
asarUnpack:
  # Unpack native modules if any (none currently)
  - "**/*.node"

# ── Files to include ─────────────────────────────────────────
files:
  - "src/**/*"
  - "assets/**/*"
  - "client-config.json"
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,LICENSE,license,LICENCE}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,spec,specs}"
  - "!**/node_modules/.cache"
  - "!**/*.{ts,tsx,map,md}"

# ── Extra files (outside ASAR, alongside exe) ────────────────
# client-config.json ships alongside the exe for per-client builds
extraResources:
  - from: "client-config.json"
    to: "../client-config.json"
    filter:
      - "*.json"

# ── Windows Configuration ────────────────────────────────────
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker

# ── Compression ──────────────────────────────────────────────
compression: store

# ── Electron Builder Hooks ───────────────────────────────────
# afterSign: scripts/notarize.js   # macOS notarization (if needed later)
afterPack: scripts/set-fuses.js
