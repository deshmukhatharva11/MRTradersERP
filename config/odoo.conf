[options]
; =============================================================
; MR Traders ERP — Odoo 19.0 Configuration
; =============================================================

; ── Server ───────────────────────────────────────────────────
xmlrpc_port = 8069
longpolling_port = 8072
; Uncomment to restrict to localhost only (useful in production behind nginx)
; xmlrpc_interface = 127.0.0.1

; ── Database ─────────────────────────────────────────────────
; These are overridden by docker-compose command-line args
; but kept here as documentation / fallback
db_host = db
db_port = 5432
db_name = mrtraders_dev
db_user = odoo
db_password = odoo_secret
db_maxconn = 64

; ── Addon paths ──────────────────────────────────────────────
; Odoo built-in addons  +  MR Traders custom addons
addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons

; ── Data & Logs ──────────────────────────────────────────────
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info
; log_level = debug   ; Uncomment for verbose debugging

; ── Performance ──────────────────────────────────────────────
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120

; ── Security ─────────────────────────────────────────────────
; Set a long random string in production
admin_passwd = mrtraders_master_pwd_CHANGE_IN_PROD

; Allow database manager in development (set to False in production)
list_db = True

; ── Dev mode (disable in production) ─────────────────────────
; dev_mode = reload,qweb,werkzeug,xml

; ── Email ────────────────────────────────────────────────────
; smtp_server = smtp.gmail.com
; smtp_port = 587
; smtp_ssl = True
; smtp_user = your@email.com
; smtp_password = yourpassword
; email_from = MR Traders ERP <erp@mrtraders.pk>
